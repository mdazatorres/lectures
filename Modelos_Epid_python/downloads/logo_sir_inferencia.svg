<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama SIR con inferencia e incertidumbre</title>
  <desc id="desc">Los parámetros estimados anteceden al flujo SIR. Los casos observados se usan para la inferencia, y una flecha punteada pasa por debajo del diagrama para volver a los parámetros con su incertidumbre.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#405867"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#2878B5"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#173042" flood-opacity="0.13"/>
    </filter>
  </defs>

  <!-- Parámetros estimados, antes del modelo SIR -->
  <g filter="url(#shadow)">
    <rect x="60" y="258" width="250" height="92" rx="34" fill="#EEF5FA" stroke="#2878B5" stroke-width="3"/>
  </g>
  <text x="185" y="286" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#204A67">parámetros estimados</text>
  <text x="185" y="315" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#2878B5">θ̂ = (β̂, γ̂)</text>
  <text x="185" y="338" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#405867">con incertidumbre</text>

  <!-- El flujo SIR -->
  <text x="785" y="91" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" letter-spacing="2.5" fill="#405867">MODELO SIR</text>
  <line x1="318" y1="304" x2="349" y2="304" stroke="#2878B5" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrowBlue)"/>
  <text x="625" y="176" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#405867">β SI / N</text>
  <line x1="581" y1="304" x2="669" y2="304" stroke="#405867" stroke-width="3.5" marker-end="url(#arrow)"/>
  <text x="945" y="176" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#405867">γ I</text>
  <line x1="901" y1="304" x2="989" y2="304" stroke="#405867" stroke-width="3.5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <circle cx="465" cy="304" r="105" fill="#D9EAF7" stroke="#2878B5" stroke-width="4"/>
    <circle cx="785" cy="304" r="105" fill="#F9D7D1" stroke="#E05C47" stroke-width="4"/>
    <circle cx="1105" cy="304" r="105" fill="#F7E7CD" stroke="#D99B50" stroke-width="4"/>
  </g>
  <text x="465" y="303" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="700" fill="#2878B5">S</text>
  <text x="785" y="303" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="700" fill="#D64B3B">I</text>
  <text x="1105" y="303" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="700" fill="#C6823B">R</text>
  <text x="465" y="365" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#405867">susceptibles</text>
  <text x="785" y="365" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#405867">infecciosos</text>
  <text x="1105" y="365" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#405867">recuperados</text>

  <!-- Salida observable del modelo -->
  <path d="M 786 416 L 786 490" fill="none" stroke="#2878B5" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="813" y="468" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#2878B5">incidencia</text>

  <!-- Curva del modelo, incertidumbre y datos observados -->
  <g transform="translate(470,518)">
    <rect x="0" y="0" width="650" height="154" rx="22" fill="#FAFCFD" stroke="#C9D8E1" stroke-width="2"/>
    <line x1="48" y1="121" x2="608" y2="121" stroke="#AABBC6" stroke-width="2"/>
    <line x1="48" y1="121" x2="48" y2="30" stroke="#AABBC6" stroke-width="2"/>
    <path d="M 60 114 C 120 111 151 92 185 49 C 214 17 253 13 290 32 C 345 63 389 101 580 114 L 580 126 C 389 123 345 95 290 62 C 253 40 214 45 185 81 C 151 116 120 125 60 126 Z" fill="#D9EAF7" opacity="0.95"/>
    <path d="M 60 120 C 120 118 151 105 185 65 C 214 31 253 26 290 47 C 345 79 389 112 580 120" fill="none" stroke="#2878B5" stroke-width="5" stroke-linecap="round"/>
    <g fill="#E05C47" stroke="#FFFFFF" stroke-width="3">
      <circle cx="78" cy="115" r="8"/><circle cx="132" cy="106" r="8"/><circle cx="174" cy="83" r="8"/>
      <circle cx="219" cy="35" r="8"/><circle cx="266" cy="43" r="8"/><circle cx="315" cy="72" r="8"/>
      <circle cx="363" cy="99" r="8"/><circle cx="432" cy="112" r="8"/><circle cx="508" cy="119" r="8"/>
    </g>
    <text x="72" y="29" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#405867">casos observados</text>
    <circle cx="333" cy="23" r="6.5" fill="#E05C47"/>
    <line x1="355" y1="23" x2="391" y2="23" stroke="#2878B5" stroke-width="5" stroke-linecap="round"/>
    <text x="402" y="30" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#405867">modelo</text>
    <rect x="476" y="15" width="31" height="15" rx="3" fill="#D9EAF7"/>
    <text x="516" y="30" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#405867">incertidumbre</text>
  </g>

  <!-- De los datos a la inferencia, y de ahí a los parámetros -->
  <path d="M 1120 594 C 1155 594 1175 570 1208 570" fill="none" stroke="#2878B5" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <g filter="url(#shadow)">
    <rect x="1210" y="520" width="300" height="100" rx="22" fill="#FFFFFF" stroke="#405867" stroke-width="2.5"/>
  </g>
  <text x="1360" y="560" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#405867">inferencia</text>
  <text x="1360" y="592" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#405867">datos  →  θ̂ ± incertidumbre</text>
  <path d="M 1360 620 C 1368 730 1230 785 1010 792 C 720 820 410 810 205 718 C 140 688 152 510 185 358" fill="none" stroke="#405867" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
</svg>
